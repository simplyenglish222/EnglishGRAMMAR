<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 неправильных глаголов | English flashcards</title>
<style>
:root{color-scheme:light;--ink:#17243a;--muted:#5d6c83;--blue:#2558c9;--line:#dce4f0;--bg:#f1f5fc;--green:#16704e}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#e2edff,transparent 65%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:20px}main{width:min(780px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(20px,5vw,44px);box-shadow:0 20px 70px #294e8515}header{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}.progress{height:7px;background:#e9eef7;border-radius:10px;overflow:hidden;margin-top:15px}.progress div{height:100%;background:var(--blue);border-radius:10px;transition:width .25s}.prompt{text-align:center;margin:clamp(30px,7vw,60px) 0 30px}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:700}h1{font-size:clamp(30px,6vw,52px);line-height:1.15;overflow-wrap:anywhere;margin:13px 0 8px;letter-spacing:-.035em}.hint{color:var(--muted);font-size:15px;line-height:1.5;min-height:23px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.flash{appearance:none;font:inherit;border:2px solid var(--line);border-radius:18px;min-height:170px;padding:15px 8px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:12px;background:#f7f9fd;color:var(--ink);cursor:pointer;transition:background .18s,border-color .18s,transform .18s}.flash:disabled{cursor:default;background:#f0f2f6;color:#748093;opacity:.75}.flash.active{border-color:var(--blue);background:#eef4ff;box-shadow:0 0 0 3px #2558c911}.flash.active:hover{transform:translateY(-3px)}.flash.revealed{border-color:#a6d7c4;background:#eef9f4;color:var(--green);cursor:default}.label{font-size:12px;font-weight:750;letter-spacing:.035em;text-align:center}.word{font-weight:800;font-size:clamp(20px,4vw,34px);line-height:1.1;overflow-wrap:anywhere;text-align:center}.foot{font-size:11px;color:var(--muted);line-height:1.3;text-align:center}.audio{background:none;border:0;font:inherit;font-size:18px;color:var(--blue);cursor:pointer;min-width:42px;min-height:34px;border-radius:8px}.audio:disabled{visibility:hidden}.cardwrap{display:flex;flex-direction:column;gap:4px;min-width:0}.nav{display:flex;align-items:center;justify-content:space-between;margin-top:25px;gap:12px}.nav button,.restart{border:0;border-radius:14px;padding:13px 19px;font:inherit;font-weight:700;cursor:pointer}.back{background:#edf1f7;color:var(--ink)}.next,.restart{background:var(--blue);color:#fff}.nav button:disabled{opacity:.38;cursor:not-allowed}.keys{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 0}.done{text-align:center;padding:40px 0}.done .trophy{font-size:55px}.done p{color:var(--muted)}button:focus-visible{outline:3px solid #d49c24;outline-offset:4px}[hidden]{display:none!important}@media(max-width:480px){body{padding:10px}main{padding:20px 13px;border-radius:20px}.cards{gap:7px}.flash{min-height:150px;padding:12px 4px}.label{font-size:10px}.word{font-size:clamp(17px,5.7vw,25px)}.foot{font-size:10px}.nav button{padding:12px 14px}.keys{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.variants{display:block;font-size:clamp(13px,2.5vw,19px);line-height:1.3;margin-top:8px;font-weight:700;white-space:normal;overflow-wrap:normal}.flash .word{width:100%}.flash{width:100%}.audio{min-height:44px}.review-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:24px}.review-badge{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.08em}.review-count{font-weight:700;color:var(--muted);font-size:13px}.review-dots{display:flex;gap:6px;justify-content:center;margin:20px 0 0}.review-dots span{height:6px;flex:1;background:#e9eef7;border-radius:8px}.review-dots .past{background:#73b79b}.review-dots .current{background:var(--blue)}.review-prompt{margin:25px 0 22px}.review-card{min-height:150px;cursor:default}.review-card .word{opacity:.45}.review-card.revealed .word{opacity:1;animation:reveal .4s ease-out both}.review-card.revealed{cursor:default}.review-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}.review-controls button{font:inherit;font-weight:700;color:var(--ink);border:1px solid var(--line);background:#f7f9fd;border-radius:12px;padding:12px 15px;min-height:44px;cursor:pointer}.review-controls button:disabled{opacity:.45;cursor:default}.review-status{margin:16px 0 0;min-height:42px;text-align:center;color:var(--muted);font-size:14px}.review-next{width:100%;margin-top:8px}.review-next button{width:100%;min-height:48px}.review-summary{display:grid;gap:8px;margin-top:20px}.summary-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;align-items:center}.summary-row strong{color:var(--green);overflow-wrap:anywhere}.summary-row small{display:block;color:var(--muted);font-weight:600;margin-top:3px}@keyframes reveal{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){body{padding:10px;place-items:start center}main{margin:auto 0;padding:18px 12px}.prompt{margin:28px 0 23px}.flash{min-height:154px;gap:9px}.word{font-size:clamp(16px,5.4vw,24px)}.variants{font-size:clamp(12px,3.7vw,15px);margin-top:5px}.review-prompt{margin:24px 0 20px}.review-controls button{flex:1;padding:10px 7px;font-size:13px}.review-card{min-height:136px}.summary-row{font-size:12px;padding:9px 8px}.nav button{min-height:46px}.review-status{font-size:13px}.review-head{margin-top:20px}}@media(max-height:500px) and (orientation:landscape){body{place-items:start center;padding:8px}main{padding:15px}.prompt{margin:12px 0}.flash{min-height:110px}.review-prompt{margin:12px 0}.review-card{min-height:105px}.keys{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head><body><main>
<header><span>IRREGULAR VERBS · 30</span><span id="counter"></span></header>
<div class="progress" role="progressbar" aria-label="Прогресс" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" id="progress"><div id="bar"></div></div>
<section id="study"><div class="prompt"><div class="eyebrow">Переведите на английский</div><h1 id="russian"></h1><div class="hint" id="hint" aria-live="polite"></div></div>
<div class="cards" id="cards"></div>
<div class="nav"><button id="back" class="back" aria-label="Предыдущий глагол">← Назад</button><button id="next" class="next" aria-label="Следующий глагол">Далее →</button></div>
<p class="keys">Клавиши 1, 2, 3 или пробел — открыть форму · ← → — переход</p></section>
<section id="review" hidden>
<div class="review-head"><span class="review-badge">ПОВТОРЕНИЕ · 5 ГЛАГОЛОВ</span><span class="review-count" id="reviewCount"></span></div>
<div class="review-dots" id="reviewDots" aria-hidden="true"></div>
<div id="reviewAnimation"><div class="prompt review-prompt"><div class="eyebrow">Вспомните три формы</div><h1 id="reviewRussian"></h1><div class="hint">Формы появятся по очереди.</div></div>
<div class="cards" id="reviewCards"></div></div>
<div id="reviewSummary" hidden><div class="prompt review-prompt"><div class="eyebrow">Все пять глаголов</div><h1>Повторение завершено</h1></div><div class="review-summary" id="summaryRows"></div></div>
<div class="review-controls"><button id="pauseReview">⏸ Пауза</button><button id="replayReview">↻ Повторить</button></div>
<p class="review-status" id="reviewStatus" aria-live="polite"></p>
<div class="nav review-next"><button class="next" id="reviewNext" disabled>Далее →</button></div>
</section>
<section id="done" class="done" hidden><div class="trophy" aria-hidden="true">🏆</div><h1>Отличная работа!</h1><p>Вы повторили все 30 неправильных глаголов.</p><button class="restart" id="restart">Повторить с начала ↻</button></section>
</main><script>
'use strict';
const verbs=[
['быть','be','was / were','been'],['иметь','have','had','had'],['делать, выполнять','do','did','done'],['говорить, сказать','say','said','said'],['идти, ехать','go','went','gone'],['получать, становиться','get','got','got'],['делать, создавать','make','made','made'],['знать','know','knew','known'],['думать','think','thought','thought'],['брать','take','took','taken'],['видеть','see','saw','seen'],['приходить, приезжать','come','came','come'],['давать','give','gave','given'],['находить','find','found','found'],['рассказывать, сообщать','tell','told','told'],['становиться','become','became','become'],['уходить, оставлять','leave','left','left'],['чувствовать','feel','felt','felt'],['класть, ставить','put','put','put'],['приносить','bring','brought','brought'],['начинать','begin','began','begun'],['держать','hold','held','held'],['писать','write','wrote','written'],['стоять','stand','stood','stood'],['слышать','hear','heard','heard'],['позволять','let','let','let'],['означать, иметь в виду','mean','meant','meant'],['держать, хранить','keep','kept','kept'],['читать','read','read','read'],['встречать, знакомиться','meet','met','met']
];
const labels=['V1 · Infinitive','V2 · Past Simple','V3 · Past Participle'];
const explanations=['Начальная форма','Прошедшее время','Причастие прошедшего времени'];
const $=id=>document.getElementById(id);
let index=0,revealed=0,mode='study',reviewStart=0,reviewIndex=0,reviewStage=0,reviewPaused=false,reviewComplete=false,timer=null;
const completedReviews=new Set();
function variant(v,i){return i===0?(v[1]==='be'?'am / is / are':v[1]==='have'?'have / has':''):''}
function fillWord(el,v,i,visible){el.replaceChildren(document.createTextNode(visible?v[i+1]:'?'));if(visible&&variant(v,i)){const sub=document.createElement('span');sub.className='variants';sub.textContent=variant(v,i);el.append(sub)}}
function say(v,i){if(!('speechSynthesis' in window))return;let spoken=v[i+1];if(variant(v,i))spoken+=', '+variant(v,i);if(v[1]==='read'&&i>0)spoken='red';spoken=spoken.replaceAll(' / ', ', ');const u=new SpeechSynthesisUtterance(spoken);u.lang='en-GB';u.rate=.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
function setMode(next){mode=next;for(const name of ['study','review','done'])$(name).hidden=name!==mode}
function update(){const v=verbs[index];$('counter').textContent=`${index+1} / ${verbs.length}`;$('bar').style.width=`${(index+revealed/3)/verbs.length*100}%`;$('progress').setAttribute('aria-valuenow',String(Math.floor(index+revealed/3)));$('russian').textContent=v[0];$('hint').textContent=revealed===3?(v[1]==='read'?'Read: V1 /riːd/, V2 и V3 /red/.':'Все формы открыты. Переходите дальше.'):`Вспомните и откройте форму ${revealed+1} из 3.`;$('back').disabled=index===0;$('next').disabled=revealed<3;$('next').textContent=(index+1)%5===0&&!completedReviews.has(index)?'Повторение →':index===verbs.length-1?'Завершить →':'Далее →';for(let i=0;i<3;i++){const b=$('form'+i),a=$('audio'+i);b.className='flash '+(i<revealed?'revealed':i===revealed?'active':'');b.disabled=i!==revealed;fillWord(b.querySelector('.word'),v,i,i<revealed);b.querySelector('.foot').textContent=i<revealed?(variant(v,i)?'Формы Present Simple':explanations[i]):i===revealed?'Нажмите, чтобы открыть':'Откройте предыдущую';b.setAttribute('aria-label',`${labels[i]}: ${i<revealed?v[i+1]+' '+variant(v,i):'открыть форму'}`);a.disabled=i>=revealed}}
function focus(id){$(id).focus({preventScroll:true})}
function openForm(i){if(mode!=='study'||i!==revealed||i>2)return;revealed++;update();focus(revealed<3?'form'+revealed:'next')}
function advance(){if(index===verbs.length-1){setMode('done');$('counter').textContent='30 / 30';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','30');focus('restart');return}index++;revealed=0;setMode('study');update();focus('form0')}
function goNext(){if(mode!=='study'||revealed!==3)return;if((index+1)%5===0&&!completedReviews.has(index)){startReview();return}advance()}
function goBack(){if(mode!=='study'||index===0)return;index--;revealed=0;update();focus('form0')}
function stopTimer(){clearTimeout(timer);timer=null}
function renderReview(){const v=verbs[reviewStart+reviewIndex];$('reviewCount').textContent=`${reviewIndex+1} / 5`;$('reviewRussian').textContent=v[0];$('reviewDots').replaceChildren(...Array.from({length:5},(_,i)=>{const d=document.createElement('span');d.className=i<reviewIndex?'past':i===reviewIndex?'current':'';return d}));for(let i=0;i<3;i++){const b=$('rform'+i);const shown=i<reviewStage;b.className='flash review-card'+(shown?' revealed':'');fillWord(b.querySelector('.word'),v,i,shown);b.querySelector('.foot').textContent=shown?(variant(v,i)?'Формы Present Simple':explanations[i]):'…'}$('reviewStatus').textContent=reviewPaused?'Пауза. Нажмите «Продолжить».':reviewStage===3?'Запомните все три формы.':'Попробуйте вспомнить форму до её появления.'}
function schedule(){stopTimer();if(mode!=='review'||reviewPaused||reviewComplete)return;const delay=[1000,950,950,1700][reviewStage];timer=setTimeout(()=>{if(mode!=='review'||reviewPaused)return;if(reviewStage<3){reviewStage++;renderReview();schedule()}else if(reviewIndex<4){reviewIndex++;reviewStage=0;renderReview();schedule()}else finishReview()},delay)}
function restartReview(){stopTimer();reviewIndex=0;reviewStage=0;reviewPaused=false;reviewComplete=false;$('reviewAnimation').hidden=false;$('reviewSummary').hidden=true;$('reviewNext').disabled=true;$('pauseReview').disabled=false;$('pauseReview').textContent='⏸ Пауза';renderReview();schedule()}
function startReview(){reviewStart=index-4;setMode('review');$('counter').textContent=`${reviewStart+1}–${index+1} / 30`;$('reviewNext').textContent=index===29?'Завершить →':`Следующие 5 глаголов →`;restartReview()}
function finishReview(){stopTimer();reviewComplete=true;$('reviewAnimation').hidden=true;$('reviewSummary').hidden=false;$('reviewCount').textContent='5 / 5';for(const d of $('reviewDots').children)d.className='past';const rows=$('summaryRows');rows.replaceChildren();for(const v of verbs.slice(reviewStart,reviewStart+5)){const row=document.createElement('div');row.className='summary-row';const ru=document.createElement('span');ru.textContent=v[0];const en=document.createElement('strong');en.textContent=v.slice(1).join(' · ');if(variant(v,0)){const sub=document.createElement('small');sub.textContent=variant(v,0);en.append(sub)}row.append(ru,en);rows.append(row)}$('reviewStatus').textContent='Можно повторить анимацию или перейти дальше.';$('pauseReview').disabled=true;$('reviewNext').disabled=false;focus('reviewNext')}
function togglePause(){if(mode!=='review'||reviewComplete)return;reviewPaused=!reviewPaused;$('pauseReview').textContent=reviewPaused?'▶ Продолжить':'⏸ Пауза';if(reviewPaused){stopTimer();$('reviewStatus').textContent='Пауза. Нажмите «Продолжить».'}else{renderReview();schedule()}}
for(let i=0;i<3;i++){const wrap=document.createElement('div');wrap.className='cardwrap';const button=document.createElement('button');button.type='button';button.id='form'+i;button.className='flash';button.innerHTML=`<span class="label">${labels[i]}</span><span class="word">?</span><span class="foot"></span>`;button.addEventListener('click',()=>openForm(i));const audio=document.createElement('button');audio.type='button';audio.id='audio'+i;audio.className='audio';audio.textContent='🔊';audio.setAttribute('aria-label','Прослушать '+labels[i]);audio.addEventListener('click',()=>say(verbs[index],i));if(!('speechSynthesis' in window))audio.style.display='none';wrap.append(button,audio);$('cards').append(wrap);const rb=document.createElement('div');rb.id='rform'+i;rb.className='flash review-card';rb.innerHTML=`<span class="label">${labels[i]}</span><span class="word">?</span><span class="foot"></span>`;$('reviewCards').append(rb)}
$('next').addEventListener('click',goNext);$('back').addEventListener('click',goBack);$('pauseReview').addEventListener('click',togglePause);$('replayReview').addEventListener('click',restartReview);$('reviewNext').addEventListener('click',()=>{if(!reviewComplete)return;completedReviews.add(index);advance()});$('restart').addEventListener('click',()=>{stopTimer();index=0;revealed=0;completedReviews.clear();setMode('study');update();focus('form0')});document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||e.repeat)return;if(mode==='review'){if(e.key==='ArrowRight'&&reviewComplete){e.preventDefault();$('reviewNext').click()}return}if(mode!=='study')return;if(['1','2','3'].includes(e.key)){e.preventDefault();openForm(Number(e.key)-1)}else if(e.key==='ArrowRight'){e.preventDefault();goNext()}else if(e.key==='ArrowLeft'){e.preventDefault();goBack()}else if(e.code==='Space'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();openForm(revealed)}});update();
</script></body></html>
