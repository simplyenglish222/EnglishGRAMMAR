const O={"ps": {"summary": "Present Simple показывает не то, что происходит прямо сейчас, а то, что является обычным, повторяющимся, постоянным или считается фактом.", "ideas": [["1. Привычки и регулярные действия", "Если действие повторяется: каждый день, обычно, часто, по выходным и т. д.", "I usually get up at 7.", "Я обычно встаю в 7."], ["2. Факты и постоянные ситуации", "Используем Present Simple для того, что в целом верно или относительно постоянно.", "My aunt lives in London.", "Моя тётя живёт в Лондоне."], ["3. Расписания", "Расписания уроков, поездов, фильмов и других событий часто выражаются Present Simple, даже если речь о будущем.", "The lesson starts at 5 tomorrow.", "Урок начинается завтра в 5."], ["4. Глаголы состояния", "Know, like, love, want, need, understand и некоторые другие глаголы обычно не употребляются в Continuous, потому что обозначают состояние, а не процесс.", "I know the answer.", "Я знаю ответ."]], "compare": ["Present Simple vs Present Continuous", "I play tennis every Saturday. = это привычка.\nI am playing tennis now. = действие идёт прямо сейчас."], "warning": "Не ориентируйся только на слово today. Важно понять смысл: обычное действие или временная ситуация прямо сейчас / в этот период.", "checks": [{"q": "Which sentence describes a routine?", "o": ["I am doing my homework now.", "I do my homework after school."], "a": 1, "w": "After school здесь описывает обычную привычку, поэтому Present Simple.", "ru": ""}, {"q": "Which sentence is a fact or permanent situation?", "o": ["Water boils at 100°C.", "The water is boiling now."], "a": 0, "w": "Общий факт выражается Present Simple.", "ru": ""}, {"q": "Which sentence is correct?", "o": ["I am knowing the answer.", "I know the answer."], "a": 1, "w": "Know обычно является глаголом состояния, поэтому используем Present Simple.", "ru": ""}]}, "pc": {"summary": "Present Continuous показывает действие в процессе: оно происходит сейчас, около настоящего момента или является временной ситуацией.", "ideas": [["1. Действие прямо сейчас", "Если действие происходит в момент речи, используем am/is/are + V-ing.", "Leila is talking on the phone now.", "Лейла сейчас разговаривает по телефону."], ["2. Временная ситуация", "Действие может не происходить именно в эту секунду, но ситуация временная в текущий период.", "I am reading a new book this week.", "На этой неделе я читаю новую книгу."], ["3. Изменяющиеся ситуации", "Continuous часто используется, когда ситуация постепенно меняется.", "The weather is getting colder.", "Погода становится холоднее."], ["4. Договорённость на будущее", "Для личного уже организованного плана можно использовать Present Continuous.", "We are meeting Anna tomorrow.", "Мы встречаемся с Анной завтра."]], "compare": ["Present Continuous vs Present Simple", "She works in a school. = это её обычная работа.\nShe is working from home today. = сегодня ситуация временная."], "warning": "Глаголы состояния, например know, like, love, want, need, understand, обычно не ставятся в Continuous.", "checks": [{"q": "Which sentence describes something happening now?", "o": ["He plays football every Friday.", "He is playing football now."], "a": 1, "w": "Now указывает на действие в процессе.", "ru": ""}, {"q": "Which sentence describes a temporary situation?", "o": ["They live in Warsaw.", "They are living with friends this month."], "a": 1, "w": "This month показывает временную ситуацию.", "ru": ""}, {"q": "Which sentence is normally correct?", "o": ["I understand you.", "I am understanding you."], "a": 0, "w": "Understand обычно является глаголом состояния.", "ru": ""}]}, "past": {"summary": "Past Simple описывает действие, которое произошло и закончилось в прошлом. Важно, что прошлый период уже отделён от настоящего.", "ideas": [["1. Завершённое действие", "Часто известно, когда именно действие произошло: yesterday, last week, in 2024, two days ago.", "We watched a film yesterday.", "Мы посмотрели фильм вчера."], ["2. Последовательность событий", "Past Simple удобно использовать для цепочки законченных событий.", "I got up, had breakfast and left home.", "Я встал, позавтракал и вышел из дома."], ["3. Прошлые привычки и состояния", "Можно говорить о том, что регулярно происходило или было верно раньше.", "I played outside every day when I was a child.", "В детстве я каждый день играл на улице."], ["4. Неправильные глаголы", "У неправильных глаголов форма V2 не образуется через -ed: go → went, see → saw, eat → ate.", "She went home early.", "Она рано ушла домой."]], "compare": ["Past Simple vs Present Perfect", "I lost my key yesterday. = есть конкретное законченное время yesterday.\nI have lost my key. = важно, что ключа нет сейчас; время не называется."], "warning": "После did / didn’t всегда используется V1: Did you go? Не Did you went?", "checks": [{"q": "Which sentence belongs to a finished past time?", "o": ["I saw him yesterday.", "I have seen him before."], "a": 0, "w": "Yesterday — законченный период прошлого, поэтому Past Simple.", "ru": ""}, {"q": "Choose the correct sentence.", "o": ["Did she went home?", "Did she go home?"], "a": 1, "w": "После Did используется начальная форма глагола.", "ru": ""}, {"q": "Which form is the Past Simple of “see”?", "o": ["seen", "saw"], "a": 1, "w": "See → saw в Past Simple; seen — это V3.", "ru": ""}]}, "pastc": {"summary": "Past Continuous показывает, что действие было в процессе в определённый момент прошлого. Мы как будто смотрим на прошлую ситуацию изнутри, пока она ещё продолжалась.", "ideas": [["1. Действие в процессе в конкретный момент", "Если в 8 вечера действие уже шло, используем was/were + V-ing.", "At 8 p.m. I was doing my homework.", "В 8 вечера я делал домашнюю работу."], ["2. Фон + короткое событие", "Длительное фоновое действие часто стоит в Past Continuous, а короткое событие — в Past Simple.", "I was sleeping when the phone rang.", "Я спал, когда зазвонил телефон."], ["3. Два одновременных процесса", "Если два действия одновременно были в процессе, часто используем Past Continuous в обеих частях.", "While I was studying, my brother was playing.", "Пока я занимался, мой брат играл."], ["4. Was или were", "I/he/she/it → was. You/we/they → were.", "They were waiting outside.", "Они ждали на улице."]], "compare": ["Past Continuous vs Past Simple", "I was walking home when I saw Anna.\nwas walking = процесс; saw = короткое завершённое событие."], "warning": "Past Continuous обычно не нужен для последовательности законченных событий. Для “пришёл, поел, ушёл” используем Past Simple.", "checks": [{"q": "Which action was in progress?", "o": ["I was reading when you called.", "You called me at 8."], "a": 0, "w": "Was reading показывает процесс, который уже шёл.", "ru": ""}, {"q": "Choose the correct form: At 7, they ___ dinner.", "o": ["were having", "had"], "a": 0, "w": "Если подчёркиваем действие в процессе в 7 часов, нужен Past Continuous.", "ru": ""}, {"q": "Which sentence shows a short event interrupting a longer action?", "o": ["I was sleeping when the doorbell rang.", "I slept and the doorbell was ringing."], "a": 0, "w": "Was sleeping — фон, rang — короткое событие.", "ru": ""}]}, "pp": {"summary": "Present Perfect связывает прошлое с настоящим. Действие произошло раньше, но нам важен его результат сейчас, опыт до настоящего момента или период, который ещё продолжается. Это не просто “прошедшее время без даты”.", "ideas": [["1. Результат важен сейчас", "Действие уже закончилось, но его последствие видно или важно сейчас.", "I have lost my key.", "Я потерял ключ. Сейчас ключа у меня нет."], ["2. Опыт до настоящего момента", "Говорим, случалось ли что-то когда-либо в жизни. Точное прошлое время не называем.", "Have you ever been to Italy?", "Ты когда-нибудь был в Италии?"], ["3. Just, already, yet", "Just = только что; already = уже; yet часто используется в вопросах и отрицаниях со значением “уже/ещё”.", "She has just arrived.", "Она только что приехала."], ["4. Незаконченный период времени", "Если период ещё продолжается, можно использовать Present Perfect: today, this week, this month, this year.", "I have had three lessons today.", "Сегодня у меня было три урока, и сегодняшний день ещё не закончился."], ["5. From the past until now", "С глаголами состояния Present Perfect может показывать состояние, начавшееся раньше и продолжающееся сейчас.", "I have known her for five years.", "Я знаю её уже пять лет."], ["6. Been и gone", "Has gone to = человек ушёл/уехал туда и ещё не вернулся. Has been to = человек был там и вернулся.", "Tom has gone to the shop.", "Том ушёл в магазин и пока не вернулся."], ["7. Когда Present Perfect НЕ нужен", "Если назван законченный момент прошлого — yesterday, last year, in 2020, two days ago — используем Past Simple.", "I saw him yesterday.", "Я видел его вчера."]], "compare": ["Present Perfect vs Past Simple", "Have you seen this film? = опыт до настоящего момента, время не важно.\nDid you see this film yesterday? = спрашиваем о конкретном законченном времени."], "warning": "Не говори “I have seen him yesterday”. Yesterday требует Past Simple: I saw him yesterday.", "checks": [{"q": "Which sentence focuses on a result now?", "o": ["I have broken my glasses.", "I broke my glasses last year."], "a": 0, "w": "В первом предложении важен нынешний результат: очки сейчас сломаны.", "ru": ""}, {"q": "Which sentence is correct with “yesterday”?", "o": ["I have finished it yesterday.", "I finished it yesterday."], "a": 1, "w": "Yesterday — законченный прошлый период, поэтому Past Simple.", "ru": ""}, {"q": "Which question asks about life experience?", "o": ["Have you ever tried sushi?", "Did you try sushi at 7 yesterday?"], "a": 0, "w": "Ever без конкретной даты спрашивает об опыте до настоящего момента.", "ru": ""}]}, "ppc": {"summary": "Present Perfect Continuous связывает прошлое с настоящим и подчёркивает процесс или его длительность. Действие началось раньше и всё ещё идёт либо только что закончилось, но его следы заметны сейчас.", "ideas": [["1. Действие продолжается до сих пор", "Часто отвечаем на вопрос How long? и используем for или since.", "I have been studying for two hours.", "Я занимаюсь уже два часа."], ["2. Недавний процесс и видимый результат", "Действие могло только что закончиться, но по результату видно, что оно происходило.", "You are wet. Have you been running?", "Ты мокрый. Ты бегал?"], ["3. For и since", "For показывает длительность: for two hours. Since показывает начальную точку: since 5 o’clock.", "She has been working since 9.", "Она работает с девяти."], ["4. Процесс vs результат", "Present Perfect Continuous чаще отвечает “как долго/что происходило?”, а Present Perfect — “что сделано/сколько сделано?”.", "I have been reading for an hour.", "Я читаю уже час."], ["5. Глаголы состояния", "Know, like, believe, understand и другие stative verbs обычно не ставятся в Continuous. С ними используем Present Perfect.", "I have known him for years.", "Я знаю его много лет."]], "compare": ["Present Perfect Continuous vs Present Perfect", "I have been reading for an hour. = важен процесс и длительность.\nI have read three chapters. = важен результат: три главы."], "warning": "Не выбирай Continuous только потому, что видишь for/since. С глаголами состояния обычно нужен Present Perfect: I have known her for years.", "checks": [{"q": "Which sentence focuses on duration?", "o": ["I have read five pages.", "I have been reading for an hour."], "a": 1, "w": "For an hour подчёркивает длительность процесса.", "ru": ""}, {"q": "Which sentence focuses on a completed result?", "o": ["She has cleaned the kitchen.", "She has been cleaning all morning."], "a": 0, "w": "В первом случае важен результат: кухня убрана.", "ru": ""}, {"q": "Which sentence is normally correct?", "o": ["I have been knowing him for years.", "I have known him for years."], "a": 1, "w": "Know — глагол состояния, поэтому обычно используем Present Perfect, а не Continuous.", "ru": ""}]}, "future": {"summary": "Future Simple с will используется не для любого будущего. Чаще всего will выражает решение в момент речи, обещание, предложение, прогноз или мнение о будущем.", "ideas": [["1. Решение в момент речи", "Мы решаем что-то прямо сейчас, а не сообщаем о заранее подготовленном плане.", "The phone is ringing. I will answer it.", "Телефон звонит. Я отвечу."], ["2. Обещания и предложения помощи", "Will часто используется, когда мы обещаем или предлагаем что-то сделать.", "I will help you with your homework.", "Я помогу тебе с домашней работой."], ["3. Прогнозы и мнения", "После I think, probably, maybe часто используем will для предположения о будущем.", "I think it will rain tomorrow.", "Я думаю, завтра пойдёт дождь."], ["4. Не путай с расписанием", "Для расписаний обычно используем Present Simple.", "The train leaves at 7 tomorrow.", "Поезд отправляется завтра в 7."], ["5. Не путай с договорённостью", "Для уже организованной личной договорённости часто используется Present Continuous.", "I am meeting my friend tomorrow.", "Я встречаюсь с другом завтра."]], "compare": ["Will vs other future forms", "I will call him now. = решение принято сейчас.\nI am meeting him tomorrow. = встреча уже организована.\nThe lesson starts at 5. = расписание."], "warning": "После will всегда V1: will go, will come, will be. Не will goes и не will to go.", "checks": [{"q": "Which sentence is a spontaneous decision?", "o": ["I will answer the phone.", "I am meeting Anna tomorrow."], "a": 0, "w": "Will часто используется для решения, принятого в момент речи.", "ru": ""}, {"q": "Which sentence describes a timetable?", "o": ["The train leaves at 8.", "The train will leaves at 8."], "a": 0, "w": "Расписание обычно выражается Present Simple.", "ru": ""}, {"q": "Choose the correct form after will.", "o": ["will come", "will comes"], "a": 0, "w": "После will всегда используется V1: come.", "ru": ""}]}};

", "lost": "потерял", "wait": "ждать", "waiting": "ждать / ожидая", "sleep": "спать", "sleeping": "спит", "live": "жить", "living": "живёт / проживая", "cook": "готовить", "cooking": "готовит", "drink": "пить", "drinks": "пьёт", "like": "любить / нравиться", "love": "любить", "loves": "любит", "know": "знать", "help": "помогать", "win": "побеждать", "rain": "дождь", "raining": "идёт дождь", "start": "начинать", "starts": "начинается", "open": "открывать", "opens": "открывается", "wear": "носить", "wearing": "носит / надет", "meet": "встречать", "meeting": "встречается", "travel": "путешествовать", "travelling": "едет / путешествует", "traveling": "едет / путешествует", "answer": "ответить / ответ", "ringing": "звонит", "look": "смотри", "listen": "слушай", "school": "школа", "home": "дом", "homework": "домашняя работа", "football": "футбол", "tennis": "теннис", "film": "фильм", "music": "музыка", "friend": "друг", "friends": "друзья", "brother": "брат", "sister": "сестра", "mum": "мама", "dad": "папа", "dinner": "ужин", "breakfast": "завтрак", "coffee": "кофе", "phone": "телефон", "book": "книга", "bus": "автобус", "outside": "на улице", "late": "поздно", "question": "вопрос", "lesson": "урок", "train": "поезд", "shop": "магазин", "door": "дверь", "key": "ключ", "keys": "ключи", "screen": "экран", "garden": "сад", "cousin": "двоюродный брат / сестра", "jeans": "джинсы", "dress": "платье", "city": "город", "office": "офис", "relatives": "родственники", "italy": "Италия", "london": "Лондон", "japan": "Япония", "moscow": "Москва", "what": "что", "where": "где", "when": "когда", "why": "почему", "how": "как", "long": "долго", "while": "пока", "but": "но", "and": "и", "so": "поэтому", "because": "потому что", "with": "с", "at": "в", "on": "на / по", "in": "в", "to": "к / в", "from": "из", "before": "раньше / до", "after": "после", "all": "весь", "this": "этот", "that": "тот", "right": "прямо", "probably": "вероятно", "maybe": "возможно", "think": "думать", "promise": "обещать", "anyone": "кто-либо", "cannot": "не могу", "not": "не"};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(x){return String(x).toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[?.!,]/g,'').replace(/\s+/g,' ')}
function wrap(root){root.querySelectorAll('.auto').forEach(el=>{if(el.dataset.wrap)return;el.dataset.wrap='1';const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{const tx=n.nodeValue;if(!/[A-Za-z]/.test(tx))return;const f=document.createDocumentFragment();let last=0,m,re=/([A-Za-z]+(?:'[A-Za-z]+)?)/g;while((m=re.exec(tx))){if(m.index>last)f.appendChild(document.createTextNode(tx.slice(last,m.index)));const sp=document.createElement('span');sp.className='word';sp.textContent=m[0];sp.dataset.ru=WORDS[m[0].toLowerCase()]||'перевод см. по контексту';sp.onclick=showWord;f.appendChild(sp);last=m.index+m[0].length}if(last<tx.length)f.appendChild(document.createTextNode(tx.slice(last)));n.parentNode.replaceChild(f,n)})})}
function showWord(e){e.stopPropagation();document.querySelectorAll('.bubble').forEach(b=>b.remove());const r=e.currentTarget.getBoundingClientRect(),b=document.createElement('div');b.className='bubble';b.textContent=e.currentTarget.dataset.ru;document.body.appendChild(b);b.style.left=(scrollX+r.left+r.width/2)+'px';b.style.top=(scrollY+r.top)+'px';setTimeout(()=>b.remove(),1600)}
document.addEventListener('click',()=>document.querySelectorAll('.bubble').forEach(b=>b.remove()));
function choiceCard(c){return `<div class="q choice" data-a="${c.a}"><div class="qt auto">${esc(c.q)}</div><div class="opts">${c.o.map((o,i)=>`<button class="opt auto" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="why"><b>Почему?</b> ${c.w}${c.ru?`<div class="trans">${esc(c.ru)}</div>`:''}</div></div>`}
function bindChoices(root){root.querySelectorAll('.choice').forEach(card=>card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(card.dataset.done)return;card.dataset.done='1';const a=+card.dataset.a,i=+b.dataset.i;card.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===a)x.classList.add('correct')});if(i!==a)b.classList.add('wrong');card.querySelector('.why').classList.add('show')}))}
function usecard(o){return `<section class="slide"><div class="kicker">Когда использовать</div><h3>Как понять это время</h3><p class="summary">${o.summary}</p>${o.ideas.map(i=>`<div class="idea"><b>${i[0]}</b><div>${i[1]}</div><div class="example"><div class="auto"><b>${esc(i[2])}</b></div><div class="ru">${esc(i[3])}</div></div></div>`).join('')}<div class="compare"><b>${o.compare[0]}</b>\n<span class="auto">${esc(o.compare[1])}</span></div><div class="warning"><b>Важно:</b> ${o.warning}</div><div class="checks">${o.checks.map(choiceCard).join('')}</div></section>`}
function formcard(k,title,p){return `<section class="slide"><div class="kicker">${k}</div><h3>${title}</h3><div class="rule auto">${esc(p.rule)}</div><div>${p.examples.map(x=>{const parts=x.split(' — ');return `<div class="example"><div class="auto"><b>${esc(parts[0])}</b></div><div class="ru">${esc(parts.slice(1).join(' — '))}</div></div>`}).join('')}</div><div class="checks">${p.checks.map(choiceCard).join('')}</div></section>`}
function inputEx(q,i){return `<div class="ex prod" data-answers='${esc(JSON.stringify(q.ans))}'><div class="num">${i+1} / 20 · ${esc(q.label)}</div><div class="qt auto">${esc(q.q)}</div><button class="translate-btn" type="button">Показать перевод</button><div class="pretrans">${esc(q.ru)}</div><div class="answer-row"><input class="answer-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Впиши ответ"><button class="check-btn" type="button">Проверить</button></div><div class="feedback"><div class="fbhead"></div><div class="why2"><b>Почему?</b> ${q.w}</div></div></div>`}
function bindProd(root){root.querySelectorAll('.prod').forEach(card=>{const tb=card.querySelector('.translate-btn'),tr=card.querySelector('.pretrans'),inp=card.querySelector('.answer-input'),btn=card.querySelector('.check-btn'),fb=card.querySelector('.feedback'),head=card.querySelector('.fbhead');tb.onclick=()=>{tr.classList.toggle('show');tb.textContent=tr.classList.contains('show')?'Скрыть перевод':'Показать перевод'};const check=()=>{if(!inp.value.trim())return;const ans=JSON.parse(card.dataset.answers),ok=ans.some(a=>norm(a)===norm(inp.value));fb.className='feedback show '+(ok?'good':'bad');if(ok){head.innerHTML='<b>Правильно.</b>'}else{head.innerHTML='<b>Пока нет.</b> Правильный вариант: <span class="auto">'+esc(ans[0])+'</span>';wrap(fb)}};btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()})})}
function menu(){document.getElementById('mlist').innerHTML=T.map(t=>`<button class="mbtn" onclick="openT('${t.id}')"><div><div class="mname">${t.name}</div><div class="mru">${t.ru}</div></div><div class="arrow">›</div></button>`).join('')}
function openT(id){const t=T.find(x=>x.id===id),o=O[id],v=document.getElementById('lesson');v.innerHTML=`<div class="sticky"><button class="back" onclick="back()">← Назад в главное меню</button></div><section class="head"><h2>${t.name}</h2><div class="mru">${t.ru}</div><p class="when">${t.when}</p><div class="markers">${t.markers.map(x=>`<span class="marker auto">${esc(x)}</span>`).join('')}</div></section>${usecard(o)}${formcard('1 · утверждение','Утвердительная форма',t.aff)}${formcard('2 · отрицание','Отрицательная форма',t.neg)}${formcard('3 · вопрос','Вопросительная форма',t.q)}<h3 class="ex-title">20 упражнений</h3><p class="sub">Форму нужно вписать самостоятельно. Перевод можно открыть до ответа.</p><div class="elist">${F[id].map(inputEx).join('')}</div><div class="bottom"><button class="back" onclick="back()">← Назад в главное меню</button></div>`;document.getElementById('menu').classList.remove('active');v.classList.add('active');wrap(v);bindChoices(v);bindProd(v);window.scrollTo(0,0)}
function back(){document.getElementById('lesson').classList.remove('active');document.getElementById('menu').classList.add('active');window.scrollTo(0,0)}
menu();
</script>
