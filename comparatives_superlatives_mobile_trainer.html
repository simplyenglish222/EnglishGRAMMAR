function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showBubble(e){e.stopPropagation();document.querySelectorAll('.bubble').forEach(x=>x.remove());const t=e.currentTarget,r=t.getBoundingClientRect(),b=document.createElement('div');b.className='bubble';b.textContent=t.dataset.ru;document.body.appendChild(b);b.style.left=(window.scrollX+r.left+r.width/2)+'px';b.style.top=(window.scrollY+r.top)+'px';setTimeout(()=>b.remove(),1600)}
document.addEventListener('click',()=>document.querySelectorAll('.bubble').forEach(x=>x.remove()));
function wrap(root){root.querySelectorAll('.auto-en').forEach(el=>{if(el.dataset.wrapped==='1')return;el.dataset.wrapped='1';const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(node=>{if(!node.nodeValue.trim())return;const txt=node.nodeValue,re=/([A-Za-z]+(?:'[A-Za-z]+)?)/g,frag=document.createDocumentFragment();let last=0,m;while((m=re.exec(txt))){if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));const s=document.createElement('span');s.className='enword';s.textContent=m[0];s.dataset.ru=WORDS[m[0].toLowerCase()]||'перевод по контексту';s.addEventListener('click',showBubble);frag.appendChild(s);last=m.index+m[0].length}if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));node.parentNode.replaceChild(frag,node)})})}
function renderMenu(){document.getElementById('menu').innerHTML=SECTIONS.map(s=>`<button class="menu-btn" onclick="openTopic('${s.id}')"><div><div class="menu-name">${s.name}</div><div class="menu-ru">${s.ru}</div></div><div class="arrow">›</div></button>`).join('')}
function checkHtml(items){return `<div class="checks">`+items.map(q=>`<div class="check" data-answer="${q[2]}"><div class="q"><span class="auto-en">${esc(q[0])}</span></div><div class="options">${q[1].map((o,j)=>`<button class="opt" data-opt="${j}"><span class="auto-en">${esc(o)}</span></button>`).join('')}</div><div class="exp"><strong>Почему?</strong> ${q[3]}<div class="translation">${q[4]}</div></div></div>`).join('')+`</div>`}
function blockHtml(b,i){return `<section class="slide"><div class="kicker">правило ${i+1}</div><h3>${b.title}</h3><div class="rule">${b.rule}</div><div class="examples">${b.examples.map(e=>`<div class="example"><div class="enline auto-en">${esc(e[0])}</div><div class="ruline">${e[1]}</div></div>`).join('')}</div>${checkHtml(b.checks)}</section>`}
function finalHtml(items){return items.map((q,i)=>`<div class="exercise" data-answer="${q[2]}"><div class="num">${i+1} / 20</div><div class="q"><span class="auto-en">${esc(q[0])}</span></div><button class="trans-btn">Посмотреть перевод</button><div class="pretranslation">${q[4]}</div><div class="options">${q[1].map((o,j)=>`<button class="opt" data-opt="${j}"><span class="auto-en">${esc(o)}</span></button>`).join('')}</div><div class="exp"><strong>Почему?</strong> ${q[3]}<div class="translation">${q[4]}</div></div></div>`).join('')}
function bind(root){root.querySelectorAll('[data-answer]').forEach(card=>{card.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{if(card.dataset.done==='1')return;card.dataset.done='1';const right=Number(card.dataset.answer),chosen=Number(btn.dataset.opt);card.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===right)b.classList.add('correct')});if(chosen!==right)btn.classList.add('wrong');card.querySelector('.exp').classList.add('show')}))});root.querySelectorAll('.trans-btn').forEach(b=>b.addEventListener('click',()=>b.nextElementSibling.classList.toggle('show')))}
function openTopic(id){const s=SECTIONS.find(x=>x.id===id),view=document.getElementById('topicView');view.innerHTML=`<div class="sticky"><button class="back" onclick="back()">← Назад в главное меню</button></div><section class="head"><h2>${s.name}</h2><div class="ru">${s.ru}</div><p>${s.intro}</p></section>${s.blocks.map((b,i)=>blockHtml(b,i)).join('')}<h3 class="final-title">20 упражнений</h3><p class="sub">Если предложение непонятно, сначала открой перевод, затем выполняй задание.</p><div class="list">${finalHtml(FINALS[id])}</div><div class="footer"></div><button class="back" onclick="back()">← Назад в главное меню</button><div class="footer"></div>`;document.getElementById('menuView').classList.remove('active');view.classList.add('active');wrap(view);bind(view);window.scrollTo({top:0,behavior:'instant'})}
